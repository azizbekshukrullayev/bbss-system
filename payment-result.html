<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBSS SYSTEM — To‘lov holati</title>
<style>body{font:16px/1.55 system-ui,sans-serif;background:#101011;color:#f6f2e8;margin:0;padding:24px}.panel{max-width:620px;margin:8vh auto;padding:22px;border:1px solid #39383a;border-radius:16px;background:#19191b}h1{font-size:23px}p{color:#b9b8b6;overflow-wrap:anywhere}button{background:#d4af58;color:#15130d;font-weight:700;border:0;border-radius:9px;padding:12px 16px;cursor:pointer}</style></head><body><section class="panel">
<h1>BBSS SYSTEM — to‘lov natijasi</h1><p id="message">Buyurtma holati tekshirilmoqda…</p><p id="details"></p><button onclick="location.href='checkout.html'">Saytga qaytish</button>
</section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://mhzplzekdgbvlkdjojaz.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_noams1RyGyPOg6FXizXAOA_gaeEamsy';
const orderId=new URLSearchParams(location.search).get('order_id');const message=document.getElementById('message');const details=document.getElementById('details');
(async()=>{if(!SUPABASE_URL.startsWith('https://')||SUPABASE_URL.includes('REPLACE_')||SUPABASE_PUBLISHABLE_KEY.includes('REPLACE_')){message.textContent='Sayt administratori Supabase public sozlamalarini kiritishi kerak.';return;}if(!orderId){message.textContent='Order ID topilmadi.';return;}const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const {data:{session}}=await client.auth.getSession();if(!session){message.textContent='To‘lov holatini ko‘rish uchun shu brauzerda akkauntingizga qayta kiring. To‘lov sahifasiga qaytish o‘z-o‘zidan to‘lov tasdig‘i hisoblanmaydi.';return;}try{const response=await fetch(`${SUPABASE_URL}/functions/v1/payment-status`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':`Bearer ${session.access_token}`},body:JSON.stringify({order_id:orderId})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Holatni tekshirish imkonsiz.');message.textContent=result.status==='paid'?'To‘lov tasdiqlandi.':`To‘lov holati: ${result.status}. Agar to‘lovni endigina qilgan bo‘lsangiz, birozdan keyin qayta tekshiring.`;details.textContent=`Buyurtma: ${result.order_id}; summa: ${Number(result.amount_uzs).toLocaleString('uz-UZ')} so‘m; kursga kirish: ${result.has_access?'ochiq':'hozircha yopiq'}.`; }catch(e){message.textContent=e.message||'Xatolik yuz berdi.';}})();
</script></body></html>
