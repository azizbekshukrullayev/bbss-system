function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
function loadData(){
  try { const raw = localStorage.getItem(STORE_KEY); if (!raw) return clone(defaultData); return { ...clone(defaultData), ...JSON.parse(raw) }; }
  catch { return clone(defaultData); }
}
let state = loadData();
let toastTimer;
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){ console.warn('Local storage unavailable', e); } }
function esc(value=''){ return String(value).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function money(value){ return new Intl.NumberFormat('uz-UZ').format(Number(value)||0) + ' so‘m'; }
function initials(name='BB'){ return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]||'').join('').toUpperCase(); }
function toast(message){ const el=$('#toast'); el.textContent=message; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2600); }
function logEvent(title, detail, level='Info'){ state.audit.unshift({title,detail,time:'Hozir',level}); state.audit=state.audit.slice(0,30); }
function head(kicker,title,desc,actions=''){ return `<div class="page-head"><div><div class="eyebrow">${esc(kicker)}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-right">${actions}</div></div>`; }
function cardHead(title,sub='',right=''){ return `<div class="card-head"><div><h3>${title}</h3>${sub?`<p>${sub}</p>`:''}</div>${right}</div>`; }
function stat(label,num,foot,icon,color='var(--gold)'){ return `<div class="card stat" style="--accent:${color}"><div class="stat-top">${label}<span class="stat-icon">${icon}</span></div><div class="stat-number">${num}</div><div class="stat-foot">${foot}</div></div>`; }
function avatar(text,color=''){ return `<span class="avatar ${esc(color)}">${esc(text)}</span>`; }
function badge(text,cls=''){ return `<span class="badge ${cls}">${esc(text)}</span>`; }
function courseProgress(course){ return Math.round((course.done.length/(course.lessons.length||1))*100); }
function courseRow(course){ const pct=courseProgress(course); return `<div class="course" data-search="${esc(course.title)} ${esc(course.category)}"><div class="course-icon">${esc(course.code)}</div><div><div class="course-title">${esc(course.title)}</div><div class="course-meta">${course.students} o‘quvchi · ${course.lessons.length} dars · ${esc(course.level)}</div><div class="progress"><span style="width:${pct}%"></span></div></div><div class="course-rate">${pct}%</div></div>`; }
function statusBadge(status){ let cls=status==='Faol'||status==='Tasdiqlangan'||status==='Bajarildi'?'green':status==='Tekshiruvda'||status==='Tekshiruv'||status==='Jarayonda'?'gold':status==='To‘lov kutilmoqda'?'red':'blue'; return badge(status,cls); }
function roleAccess(role){
  const all=['dashboard','academy','messenger','community','trading','business','projects','virtual','students','payments','ai','security','control','workspace','settings','roadmap'];
  const map={
    Owner:all,
    Admin:['dashboard','academy','messenger','community','trading','business','projects','students','payments','ai','workspace','settings'],
    Ustoz:['dashboard','academy','messenger','community','workspace','settings'],
    'O‘quvchi':['dashboard','academy','messenger','community','workspace','settings'],
    Employee:['dashboard','messenger','business','projects','workspace','settings']
  };
  return map[role]||all;
}
function applyRoleNavigation(){
  const allowed=roleAccess(state.role);
  $$('[data-page]').forEach(btn=>{ btn.hidden=!allowed.includes(btn.dataset.page); });
  $('#sidebarUser').textContent=state.role==='Owner'?'Owner Account':`${state.role} Account`;
  $('#sidebarRole').textContent=state.role==='Owner'?'To‘liq nazorat · Demo':'Cheklangan demo ruxsat';
  $('#navCourseCount').textContent=state.courses.length;
  if(!allowed.includes(state.currentPage)) state.currentPage='dashboard';
}
function render(){
  applyRoleNavigation();
  const content=$('#pageContent');

  content.innerHTML=(renderers[state.currentPage]||dashboard)();
  $('#breadcrumb').textContent=pageTitles[state.currentPage]||'Boshqaruv paneli';
  $$('#mainNav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===state.currentPage));

  document.body.classList.toggle('liquid-theme',state.theme==='liquid');
  save();
}

    <section class="card">${cardHead('Tezkor kirish','Ko‘p ishlatiladigan bo‘limlar')}<div class="card-body"><div class="quick-grid"><button class="quick" data-go="academy"><span>▣</span>Academy</button><button class="quick" data-go="students"><span>♙</span>O‘quvchilar</button><button class="quick" data-go="trading"><span>⌁</span>Trading Plan</button><button class="quick" data-go="control"><span>♛</span>Control Center</button></div></div></section></div>

}
function activity(icon,title,desc,time){return `<div class="activity-item"><div class="activity-icon">${icon}</div><div><strong>${title}</strong><p>${desc}</p></div><time>${time}</time></div>`;}

function academy(){
  const course=state.courses.find(c=>c.id===state.selectedCourse);
  if(course){
    const pct=courseProgress(course);
    return `${head('BBSS ACADEMY',esc(course.title),`${esc(course.category)} · ${esc(course.level)} · ${course.students} o‘quvchi`,`<button class="btn ghost" data-action="back-courses">← Kurslarga qaytish</button><button class="btn primary" data-action="add-lesson">＋ Dars qo‘shish</button>`)}

function roadmap(){
  const steps=[['01','Core Foundation & Design System','Mavjud kod auditi, dizayn, profil, autentifikatsiya, rollar'],['02','BBSS Academy','Invite-only, kurslar, darslar, video, progress, topshiriqlar'],['03','Central AI','AI Gateway, Personal/Professional/Owner rejimlari'],['04','Communication','Messenger, Community, realtime va bildirishnomalar'],['05','Trading & Business','Trading Workspace, Business OS va moliya'],['06','Virtual Office','Virtual bino, xonalar va uchrashuvlar'],['07','Mobile & Offline','PWA, offline ma’lumotlar va sync'],['08','Production','Test, xavfsizlik auditi, backup, monitoring, deploy']];
  return `${head('PRODUCT ROADMAP','BBSS rivojlanish rejasi','PDF talablarida ko‘rsatilgan 8 bosqichli ishlab chiqish yo‘li.',`<span class="chip green">Bosqichma-bosqich</span>`)}<div class="card"><div class="card-body"><div class="activity">${steps.map(([n,t,d],i)=>`<div class="activity-item" style="grid-template-columns:38px minmax(0,1fr) auto"><div class="activity-icon">${n}</div><div><strong>${t}</strong><p>${d}</p></div>${badge(i<2?'Ustuvor':'Rejada',i<2?'green':'gold')}</div>`).join('')}</div></div></div><div class="module-note" style="margin-top:14px">MVP qabul mezonlari: invite-only, server-side role check, kurs/ustoz/o‘quvchi biriktirish, qo‘lda payment, progress, topshiriq va baholash, audit hamda backup/restore testlari.</div>`;
}

function openModal(title,html){ $('#modalTitle').textContent=title; $('#modalContent').innerHTML=html; $('#modalBackdrop').classList.add('open'); const first=$('input,textarea,select', $('#modalContent')); if(first) setTimeout(()=>first.focus(),50); }
function closeModal(){ $('#modalBackdrop').classList.remove('open'); $('#modalContent').innerHTML=''; }
function field(label,name,placeholder='',type='text',required=true){ return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></div>`; }
function showNewTaskModal(){ openModal('Yangi vazifa',`<form id="taskModalForm">${field('Vazifa nomi','title','Masalan, dars materialini tekshirish')}${field('Loyiha','project','BBSS Core')}${field('Muddat','due','', 'date',false)}<div class="field"><label>Status</label><select name="status"><option>Kutilmoqda</option><option>Jarayonda</option></select></div><button class="btn primary" type="submit" style="width:100%">Vazifani saqlash</button></form>`); }
function actionClick(button){
  const action=button.dataset.action, id=button.dataset.id;
  if(action==='add-course') openModal('Yangi kurs',`<form id="courseForm">${field('Kurs nomi','title','Masalan, Market Structure')}${field('Qisqa kod','code','MS') }<div class="field"><label>Kategoriya</label><select name="category"><option>Asosiy</option><option>Strategiya</option><option>Amaliyot</option></select></div><div class="field"><label>Rank</label><select name="level"><option>Common</option><option>Advanced</option><option>Bronze</option><option>Silver</option><option>Gold</option><option>Brilliant</option></select></div><button class="btn primary" type="submit" style="width:100%">Kurs yaratish</button></form>`);
  else if(action==='open-course'){state.selectedCourse=id;render();}
  else if(action==='back-courses'){state.selectedCourse=null;render();}
  else if(action==='add-lesson'){openModal('Dars qo‘shish',`<form id="lessonForm">${field('Dars nomi','title','Yangi dars nomi')}<button class="btn primary" type="submit" style="width:100%">Dars qo‘shish</button></form>`);}
  else if(action==='toggle-lesson'){const c=state.courses.find(x=>x.id===state.selectedCourse);const i=Number(button.dataset.index);if(c){c.done=c.done.includes(i)?c.done.filter(x=>x!==i):[...c.done,i];logEvent('Dars progressi',`${c.title}: ${c.lessons[i]}`);save();render();}}
  else if(action==='delete-course'){if(confirm('Ushbu demo kursni o‘chirishni xohlaysizmi?')){state.courses=state.courses.filter(c=>c.id!==id);state.selectedCourse=null;logEvent('Kurs o‘chirildi',id,'Warning');save();render();toast('Kurs o‘chirildi.');}}
  else if(action==='invite-student'){const code='BBSS-'+Math.random().toString(36).slice(2,8).toUpperCase();state.invites.unshift({code,date:new Date().toISOString().slice(0,10)});logEvent('Invite yaratildi',code);save();render();toast(`Demo invite: ${code}`);}
  else if(action==='add-student') openModal('O‘quvchi qo‘shish',`<form id="studentForm">${field('Ism familiya','name','O‘quvchi ismi')}${field('Email','email','student@example.com','email')}<div class="field"><label>Rank</label><select name="rank">${['Common','Advanced','Bronze','Silver','Gold','Brilliant'].map(r=>`<option>${r}</option>`).join('')}</select></div><button class="btn primary" type="submit" style="width:100%">O‘quvchi qo‘shish</button></form>`);
  else if(action==='edit-student'){const s=state.students.find(x=>x.id===id);if(s)openModal('O‘quvchi boshqaruvi',`<form id="studentEditForm" data-id="${id}"><div class="field"><label>O‘quvchi</label><input value="${esc(s.name)}" disabled></div><div class="field"><label>Rank</label><select name="rank">${['Common','Advanced','Bronze','Silver','Gold','Brilliant'].map(r=>`<option ${s.rank===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${['Faol','Tekshiruv','To‘lov kutilmoqda','Bloklangan'].map(r=>`<option ${s.status===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Kurs</label><select name="course"><option>—</option>${state.courses.map(c=>`<option ${s.course===c.title?'selected':''}>${esc(c.title)}</option>`).join('')}</select></div><button class="btn primary" type="submit" style="width:100%">O‘zgarishlarni saqlash</button></form>`);}
  else if(action==='add-payment') openModal('To‘lovni qayd etish',`<form id="paymentForm">${field('To‘lovchi','person','Ism familiya')}${field('Summa (UZS)','amount','250000','number')}<div class="field"><label>To‘lov turi</label><select name="type"><option>Kurs to‘lovi</option><option>Qisman to‘lov</option><option>Obuna</option><option>Boshqa</option></select></div><div class="field"><label>Status</label><select name="status"><option>Tekshiruvda</option><option>Tasdiqlangan</option></select></div>${field('Sana','date', '', 'date',false)}<button class="btn primary" type="submit" style="width:100%">To‘lovni saqlash</button></form>`);
  else if(action==='approve-payment'){const p=state.payments.find(x=>x.id===id);if(p){p.status='Tasdiqlangan';logEvent('To‘lov tasdiqlandi',p.person);save();render();toast('Demo to‘lov tasdiqlandi.');}}
  else if(action==='add-trade') openModal('Savdoni jurnalga qo‘shish',`<form id="tradeForm">${field('Instrument','pair','XAUUSD')}<div class="field"><label>Yo‘nalish</label><select name="direction"><option>BUY</option><option>SELL</option></select></div>${field('Entry','entry','2740.00')}${field('Exit','exit','2745.00')}${field('Natija (USD)','result','+50','text')}${field('Setup','setup','FVG retest')}${field('Sana','date','','date',false)}<button class="btn primary" type="submit" style="width:100%">Savdoni saqlash</button></form>`);
  else if(action==='add-task') showNewTaskModal();
  else if(action==='toggle-task'){const t=state.tasks.find(x=>x.id===id);if(t){t.done=!t.done;t.status=t.done?'Bajarildi':'Jarayonda';logEvent('Vazifa holati',t.title);save();render();}}
  else if(action==='add-finance') openModal('Moliyaviy qayd',`<form id="financeForm">${field('Tavsif','desc','Masalan, kurs savdosi')}<div class="field"><label>Tur</label><select name="type"><option>Daromad</option><option>Xarajat</option></select></div>${field('Summa (UZS)','amount','100000','number')}<button class="btn primary" type="submit" style="width:100%">Saqlash</button></form>`);
  else if(action==='new-post') openModal('Community post',`<form id="postForm"><div class="field"><label>Post matni</label><textarea name="text" required placeholder="Fikringizni ulashing..." rows="5"></textarea></div><button class="btn primary" type="submit" style="width:100%">Post joylash</button></form>`);
  else if(action==='like-post'){const p=state.posts.find(x=>x.id===id);if(p){p.likes++;save();render();}}
  else if(action==='toggle-flag'){const key=button.dataset.flag;state.flags[key]=!state.flags[key];logEvent('Feature flag o‘zgardi',`${key}: ${state.flags[key]?'ON':'OFF'}`);save();render();toast('Demo feature flag yangilandi.');}
  else if(action==='save-note'){state.notes=$('#personalNotes')?.value??state.notes;save();toast('Qaydlar saqlandi.');}
  else if(action==='export-data'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='bbss-demo-data.json';a.click();URL.revokeObjectURL(url);toast('Demo ma’lumotlari eksport qilindi.');}
  else if(action==='reset-data'){if(confirm('Brauzerdagi BBSS demo ma’lumotlarini boshlang‘ich holatga qaytaramizmi?')){state=clone(defaultData);save();render();toast('Demo ma’lumotlari tiklandi.');}}
}

// Navigation and common controls
$('#mainNav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page);});
$('#pageContent').addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return;}
  const act=e.target.closest('[data-action]');if(act){actionClick(act);return;}
  const chat=e.target.closest('[data-chat]');if(chat){state.currentChat=chat.dataset.chat;render();return;}
  const theme=e.target.closest('[data-theme]');if(theme){state.theme=theme.dataset.theme;save();render();return;}
  const filter=e.target.closest('[data-course-filter]');if(filter){$$('[data-course-filter]').forEach(x=>x.classList.toggle('active',x===filter));const cat=filter.dataset.courseFilter;$$('[data-category]').forEach(el=>el.hidden=cat!=='Barchasi'&&el.dataset.category!==cat);}
});
$('#pageContent').addEventListener('change',e=>{
  if(e.target.matches('[data-check]')){state.checklist[e.target.dataset.check]=e.target.checked;save();}
  if(e.target.matches('[data-personal-check]')){state.checklist[e.target.dataset.personalCheck]=e.target.checked;save();}
});
$('#pageContent').addEventListener('submit',e=>{
  e.preventDefault();const form=e.target;const fd=new FormData(form);const v=Object.fromEntries(fd.entries());
  if(form.id==='courseForm'){
    const title=(v.title||'').trim();if(!title)return;state.courses.push({id:'c'+Date.now(),code:(v.code||initials(title)).toUpperCase().slice(0,5),title,category:v.category,level:v.level,students:0,lessons:[],done:[]});logEvent('Kurs yaratildi',title);closeModal();state.selectedCourse=state.courses[state.courses.length-1].id;save();render();toast('Yangi kurs yaratildi.');
  } else if(form.id==='lessonForm'){
    const c=state.courses.find(x=>x.id===state.selectedCourse);if(c){c.lessons.push(v.title.trim());logEvent('Dars qo‘shildi',v.title);closeModal();save();render();toast('Dars qo‘shildi.');}
  } else if(form.id==='studentForm'){
    const name=v.name.trim();state.students.push({id:'s'+Date.now(),initials:initials(name),name,email:v.email,rank:v.rank,status:'Tekshiruv',color:'blue',course:'—'});logEvent('O‘quvchi qo‘shildi',name);closeModal();save();render();toast('O‘quvchi demo ro‘yxatga qo‘shildi.');
  } else if(form.id==='studentEditForm'){
    const s=state.students.find(x=>x.id===form.dataset.id);if(s){s.rank=v.rank;s.status=v.status;s.course=v.course;logEvent('O‘quvchi profili yangilandi',s.name);closeModal();save();render();toast('O‘quvchi ma’lumoti saqlandi.');}
  } else if(form.id==='paymentForm'){
    state.payments.unshift({id:'p'+Date.now(),person:v.person,amount:Number(v.amount),date:v.date||new Date().toISOString().slice(0,10),type:v.type,status:v.status});logEvent('To‘lov qayd etildi',`${v.person} · ${v.amount} UZS`);closeModal();save();render();toast('To‘lov demo jadvaliga qo‘shildi.');
  } else if(form.id==='tradeForm'){
    state.trades.unshift({id:'t'+Date.now(),pair:v.pair.toUpperCase(),direction:v.direction,entry:v.entry,exit:v.exit,result:v.result,date:v.date||new Date().toISOString().slice(0,10),setup:v.setup});logEvent('Trading journal yangilandi',v.pair);closeModal();save();render();toast('Savdo jurnalga qo‘shildi.');
  } else if(form.id==='taskModalForm'){
    state.tasks.unshift({id:'task'+Date.now(),title:v.title,project:v.project||'General',due:v.due||'—',status:v.status,done:false});logEvent('Vazifa yaratildi',v.title);closeModal();save();render();toast('Vazifa qo‘shildi.');
  } else if(form.id==='financeForm'){
    logEvent('Moliyaviy demo qaydi',`${v.type}: ${v.desc} · ${v.amount} UZS`);closeModal();toast('Demo moliyaviy qayd saqlandi.');
  } else if(form.id==='postForm'){
    state.posts.unshift({id:'post'+Date.now(),author:state.role==='Owner'?'Owner Account':state.role,initials:state.role==='Owner'?'O':initials(state.role),color:'',time:'Hozir',text:v.text,likes:0});logEvent('Community post yaratildi',state.role);closeModal();save();render();toast('Post joylandi.');
  } else if(form.id==='chatForm'){
    const msg=(v.message||'').trim();if(!msg)return;state.chats[state.currentChat]=state.chats[state.currentChat]||[];state.chats[state.currentChat].push({from:state.role,text:msg,time:new Date().toLocaleTimeString('uz-UZ',{hour:'2-digit',minute:'2-digit'}),mine:true});save();render();const box=$('#chatMessages');if(box)box.scrollTop=box.scrollHeight;
  } else if(form.id==='aiForm'){
    const prompt=v.prompt.trim();if(!prompt)return;const box=$('#aiMessages');box.insertAdjacentHTML('beforeend',`<div class="ai-message user">${esc(prompt)}</div>`);const answer=/academy|kurs|dars/i.test(prompt)?'Academy bo‘limida kurslarni tanlang. Kurs sahifasida darslar ro‘yxati va demo progress holati mavjud.':/role|ruxsat|permission/i.test(prompt)?'PDF talablariga ko‘ra Owner, Admin, Ustoz, O‘quvchi va Employee rollari mavjud. Haqiqiy ruxsatlar serverda tekshirilishi kerak.':/roadmap|reja|bosqich/i.test(prompt)?'Yo‘l xaritasi: Core Foundation, Academy, Central AI, Communication, Trading & Business, Virtual Office, Mobile & Offline, Production.':'Bu demo AI javobi. Haqiqiy yordam uchun markaziy AI Gateway ulanishi kerak.';box.insertAdjacentHTML('beforeend',`<div class="ai-message">${answer}</div>`);form.reset();box.scrollTop=box.scrollHeight;
  }
});
$('#pageContent').addEventListener('input',e=>{
  if(e.target.id==='riskBalance'||e.target.id==='riskPercent'){const balance=Number($('#riskBalance')?.value||0),pct=Number($('#riskPercent')?.value||0);$('#riskAmount').textContent='$'+(balance*pct/100).toFixed(2);}
});
$('#mobileMenu').addEventListener('click',()=>{$('#sidebar').classList.add('open');$('#mobileOverlay').classList.add('show');});
$('#mobileOverlay').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.remove('show');});
$('#modalClose').addEventListener('click',closeModal);
$('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
$('#newTaskBtn').addEventListener('click',showNewTaskModal);
$('#notificationsBtn').addEventListener('click',()=>toast('Hozircha yangi bildirishnoma yo‘q.'));
$('#roleQuick').addEventListener('click',()=>{navigate('settings');});
$('#pageContent').addEventListener('change',e=>{if(e.target.id==='saveRole'||e.target.id==='roleSelect'){if(e.target.id==='roleSelect'){state.role=e.target.value;save();render();toast('Demo rol almashtirildi.');}}});
$('#pageContent').addEventListener('click',e=>{if(e.target.id==='saveRole'){state.role=$('#roleSelect').value;logEvent('Demo rol almashtirildi',state.role);save();render();toast('Demo rol yangilandi.');}});
$('#globalSearch').addEventListener('input',e=>{const term=e.target.value.trim().toLowerCase();$$('[data-search]').forEach(el=>{el.hidden=!!term&&!el.dataset.search.toLowerCase().includes(term);});});

render();

</script>
</body>
</html>
